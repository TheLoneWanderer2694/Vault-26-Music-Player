<!-- Queue Settings -->
<div class="section-divider">Queue Settings</div>

<div class="grid-3">
  <div>
    <label>Queue Header Color</label>
    <div class="color-picker">
      <input type="color" id="cfgQueueHeader" value="#ffffff" oninput="updatePreview()" />
      <span id="cfgQueueHeaderVal">#ffffff</span>
    </div>
  </div>
  <div>
    <label>Queue Text Color</label>
    <div class="color-picker">
      <input type="color" id="cfgQueueText" value="#b3b3b3" oninput="updatePreview()" />
      <span id="cfgQueueTextVal">#b3b3b3</span>
    </div>
  </div>
  <div>
    <label class="checkbox-group" style="margin-top: 22px;">
      <input type="checkbox" id="cfgShowQueue" checked onchange="updatePreview()" />
      <span>Show Up Next Queue</span>
    </label>
  </div>
</div>

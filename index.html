<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Spotify Widget Customizer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #181818;
      color: #ffffff;
      padding: 40px;
    }
    .container {
      max-width: 700px;
      margin: 0 auto;
      background: #242424;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .section-divider {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 8px;
      border-bottom: 1px solid #333;
      color: #1db954;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #b3b3b3;
      margin-bottom: 8px;
    }
    .color-picker {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    input[type="color"] {
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #fff;
    }
    input[type="range"] {
      width: 100%;
      accent-color: #1db954;
    }
    span {
      font-size: 0.85rem;
      color: #b3b3b3;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Colors & Visual Effects -->
  <div class="section-divider">Colors & Visual Effects</div>

  <div class="grid-3">
    <div>
      <label>Background</label>
      <div class="color-picker">
        <input type="color" id="cfgBg" value="#121212" oninput="updatePreview()" />
        <span id="cfgBgVal">#121212</span>
      </div>
      <label class="checkbox-group" style="margin-top: 6px;">
        <input type="checkbox" id="cfgTransparentBg" onchange="updatePreview()" />
        <span>Transparent BG[cite: 2]</span>
      </label>
    </div>
    <div>
      <label>Title Color</label>
      <div class="color-picker">
        <input type="color" id="cfgText" value="#ffffff" oninput="updatePreview()" />
        <span id="cfgTextVal">#ffffff</span>
      </div>
    </div>
    <div>
      <label>Artist Color</label>
      <div class="color-picker">
        <input type="color" id="cfgArtistText" value="#b3b3b3" oninput="updatePreview()" />
        <span id="cfgArtistTextVal">#b3b3b3</span>
      </div>
    </div>

    <!-- Additional Features -->
    <div>
      <label>Accent Color</label>
      <div class="color-picker">
        <input type="color" id="cfgAccent" value="#1db954" oninput="updatePreview()" />
        <span id="cfgAccentVal">#1db954</span>
      </div>
    </div>
    <div>
      <label>Card Opacity</label>
      <input type="range" id="cfgOpacity" min="0.1" max="1" step="0.05" value="1" oninput="updatePreview()" />
      <span id="cfgOpacityVal">1.0</span>
    </div>
    <div>
      <label>Visual Style</label>
      <label class="checkbox-group" style="margin-top: 6px;">
        <input type="checkbox" id="cfgShadow" checked onchange="updatePreview()" />
        <span>Enable Drop Shadow[cite: 2]</span>
      </label>
    </div>
  </div>
</div>

<script>
  function updatePreview() {
    document.getElementById('cfgBgVal').innerText = document.getElementById('cfgBg').value;
    document.getElementById('cfgTextVal').innerText = document.getElementById('cfgText').value;
    document.getElementById('cfgArtistTextVal').innerText = document.getElementById('cfgArtistText').value;
    document.getElementById('cfgAccentVal').innerText = document.getElementById('cfgAccent').value;
    document.getElementById('cfgOpacityVal').innerText = document.getElementById('cfgOpacity').value;
  }
</script>

</body>
</html>

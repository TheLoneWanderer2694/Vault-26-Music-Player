<script>
    const BASE_URL = window.location.href.split('?')[0].split('#')[0];
    const urlParams = new URLSearchParams(window.location.search);
    const code = urlParams.get('code');
    const isObsMode = urlParams.get('obs') === 'true';

    window.onload = async () => {
        // Automatically check if we have stored credentials to launch OBS mode directly
        const storedToken = localStorage.getItem('sp_access_token');
        const storedClientId = localStorage.getItem('sp_client_id');
        const storedChannel = localStorage.getItem('twitch_channel');

        if (isObsMode || (storedToken && storedClientId && storedChannel && !code)) {
            document.body.classList.add('is-obs');
            
            const root = document.documentElement;
            root.style.setProperty('--border-radius', urlParams.get('radius') || '16px');
            root.style.setProperty('--border-width', urlParams.get('bwidth') || '1px');
            root.style.setProperty('--border-color', hexToRGBA(urlParams.get('bcolor') || '#ffffff', 0.2));
            root.style.setProperty('--bg-color', urlParams.get('bgcolor') || 'rgba(18, 18, 18, 0.75)');
            root.style.setProperty('--text-color', urlParams.get('tcolor') || '#ffffff');
            root.style.setProperty('--secondary-text', urlParams.get('stcolor') || '#b3b3b3');
            root.style.setProperty('--text-align', urlParams.get('align') || 'left');
            root.style.setProperty('--widget-scale', urlParams.get('scale') || '1');

            const layout = urlParams.get('layout') || 'compact';
            const widgetEl = document.getElementById('widgetScreen');
            widgetEl.classList.add(layout);
            document.getElementById('widgetWrapper').classList.remove('hidden');

            if (layout === 'vinyl') {
                document.getElementById('liveVinylContainer').classList.remove('hidden');
                document.getElementById('albumArt').classList.add('hidden');
            }

            const token = urlParams.get('token') || storedToken;
            const refreshToken = urlParams.get('rtoken') || localStorage.getItem('sp_refresh_token');
            const clientId = urlParams.get('cid') || storedClientId;
            const rawChannel = urlParams.get('ch') || storedChannel || '';
            const channel = rawChannel.replace(/^#/, '').trim().toLowerCase();
            const fallbackId = urlParams.get('fallback') || localStorage.getItem('fallback_playlist') || '';

            if (!token || !clientId || !channel) {
                document.getElementById('trackTitle').innerText = "Config Error";
                document.getElementById('trackArtist').innerText = "Please regenerate your link from the main page";
                return;
            }

            localStorage.setItem('sp_access_token', token);
            localStorage.setItem('sp_refresh_token', refreshToken);
            localStorage.setItem('sp_client_id', clientId);
            localStorage.setItem('twitch_channel', channel);
            localStorage.setItem('fallback_playlist', fallbackId);

            startPlayerPolling();
            connectTwitchChat();
            return;
        }

        if (code) {
            await exchangeCodeForToken(code);
            window.history.replaceState({}, document.title, BASE_URL);
        }

        if (storedClientId) document.getElementById('clientIdInput').value = storedClientId;
        if (storedChannel) document.getElementById('twitchChannelInput').value = storedChannel;
        const savedFallback = localStorage.getItem('fallback_playlist');
        if (savedFallback) document.getElementById('fallbackPlaylistInput').value = savedFallback;

        document.getElementById('setupScreen').classList.remove('hidden');
        applyStylesAndLink();
    };

    function applyStylesAndLink() {
        const radius = document.getElementById('borderRadiusInput').value || '16px';
        const bwidth = document.getElementById('borderWidthInput').value || '1px';
        const bcolor = document.getElementById('borderColorInput').value || '#ffffff';
        
        const scalePercent = document.getElementById('widgetScaleInput').value || '100';
        document.getElementById('scaleVal').innerText = scalePercent;
        const scale = scalePercent / 100;

        const bgColorHex = document.getElementById('bgColorPicker').value || '#121212';
        const bgOpacity = document.getElementById('bgOpacityInput').value;
        document.getElementById('opacityVal').innerText = bgOpacity;
        const bgcolor = hexToRGBA(bgColorHex, bgOpacity / 100);

        const tcolor = document.getElementById('textColorInput').value || '#ffffff';
        const align = document.getElementById('textAlignInput').value || 'left';
        const layout = document.getElementById('layoutModeInput').value || 'compact';
        const skip = document.getElementById('enableSkipInput').value;
        const skipPerm = document.getElementById('skipPermissionInput').value;

        const cid = document.getElementById('clientIdInput').value.trim();
        const channel = document.getElementById('twitchChannelInput').value.trim().toLowerCase().replace(/^#/, '');
        let fallback = document.getElementById('fallbackPlaylistInput').value.trim();
        
        if (fallback.includes('spotify.com/playlist/')) {
            fallback = fallback.split('playlist/')[1].split('?')[0];
        } else if (fallback.startsWith('spotify:playlist:')) {
            fallback = fallback.split(':')[2];
        }

        if (cid) localStorage.setItem('sp_client_id', cid);
        if (channel) localStorage.setItem('twitch_channel', channel);
        if (fallback) localStorage.setItem('fallback_playlist', fallback);

        const previewWrapper = document.getElementById('previewWrapper');
        previewWrapper.style.setProperty('--border-radius', radius);
        previewWrapper.style.setProperty('--border-width', bwidth);
        previewWrapper.style.setProperty('--border-color', hexToRGBA(bcolor, 0.2));
        previewWrapper.style.setProperty('--bg-color', bgcolor);
        previewWrapper.style.setProperty('--text-color', tcolor);
        previewWrapper.style.setProperty('--text-align', align);
        previewWrapper.style.setProperty('--widget-scale', scale);

        const preview = document.getElementById('previewWidget');
        preview.className = `widget-container ${layout}`;

        const vinylContainer = document.getElementById('previewVinylContainer');
        const standardArt = document.getElementById('previewAlbumArt');

        vinylContainer.classList.add('hidden');
        standardArt.classList.remove('hidden');
        previewWrapper.classList.remove('is-playing');

        if (layout === 'vinyl') {
            vinylContainer.classList.remove('hidden');
            standardArt.classList.add('hidden');
            previewWrapper.classList.add('is-playing');
        }

        const token = localStorage.getItem('sp_access_token') || '';
        const rtoken = localStorage.getItem('sp_refresh_token') || '';

        const obsUrl = `${BASE_URL}?obs=true&layout=${layout}&align=${align}&scale=${scale}&skip=${skip}&skipPerm=${skipPerm}&radius=${encodeURIComponent(radius)}&bwidth=${encodeURIComponent(bwidth)}&bcolor=${encodeURIComponent(bcolor)}&bgcolor=${encodeURIComponent(bgcolor)}&tcolor=${encodeURIComponent(tcolor)}&token=${encodeURIComponent(token)}&rtoken=${encodeURIComponent(rtoken)}&cid=${encodeURIComponent(cid || '')}&ch=${encodeURIComponent(channel || '')}&fallback=${encodeURIComponent(fallback || '')}`;
        
        document.getElementById('obsGeneratedLink').value = obsUrl;
    }

    function testSimulatePlaying() {
        const wrapper = document.getElementById('previewWrapper');
        wrapper.classList.remove('transparent-obs');
        wrapper.classList.add('is-playing');
        document.getElementById('previewTitle').innerText = "Blinding Lights";
        document.getElementById('previewArtist').innerText = "The Weeknd • After Hours";
        document.getElementById('previewStatus').innerText = "Playing Live in Studio";
    }

    function testSimulatePaused() {
        const wrapper = document.getElementById('previewWrapper');
        wrapper.classList.remove('is-playing');
        document.getElementById('previewTitle').innerText = "Playback Paused / Inactive";
        document.getElementById('previewArtist').innerText = "Hiding in 5 seconds...";
        document.getElementById('previewStatus').innerText = "";
    }

    function testSimulateRequest() {
        const wrapper = document.getElementById('previewWrapper');
        wrapper.classList.remove('transparent-obs');
        document.getElementById('previewStatus').innerText = "Requested by @StreamFan99";
    }

    async function saveSettingsAndAuth() {
        const cid = document.getElementById('clientIdInput').value.trim();
        const channel = document.getElementById('twitchChannelInput').value.trim().toLowerCase().replace(/^#/, '');
        if (!cid || !channel) return alert('Please fill in your Client ID and Twitch channel.');
        
        localStorage.setItem('sp_client_id', cid);
        localStorage.setItem('twitch_channel', channel);
        
        const verifier = generateRandomString(64);
        localStorage.setItem('sp_verifier', verifier);
        const challenge = await sha256(verifier);

        const scope = 'user-read-playback-state user-modify-playback-state user-read-currently-playing playlist-read-private playlist-read-collaborative';
        const authUrl = new URL('https://accounts.spotify.com/authorize');
        authUrl.searchParams.append('client_id', cid);
        authUrl.searchParams.append('response_type', 'code');
        authUrl.searchParams.append('redirect_uri', BASE_URL);
        authUrl.searchParams.append('code_challenge_method', 'S256');
        authUrl.searchParams.append('code_challenge', challenge);
        authUrl.searchParams.append('scope', scope);

        window.location.href = authUrl.toString();
    }

    async function exchangeCodeForToken(authCode) {
        const clientId = localStorage.getItem('sp_client_id');
        const verifier = localStorage.getItem('sp_verifier');

        const response = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                client_id: clientId,
                grant_type: 'authorization_code',
                code: authCode,
                redirect_uri: BASE_URL,
                code_verifier: verifier,
            }),
        });

        const data = await response.json();
        if (data.access_token) {
            localStorage.setItem('sp_access_token', data.access_token);
            if (data.refresh_token) localStorage.setItem('sp_refresh_token', data.refresh_token);
        }
    }

    async function refreshAccessToken() {
        const clientId = localStorage.getItem('sp_client_id');
        const refreshToken = localStorage.getItem('sp_refresh_token');
        if (!refreshToken) return false;

        const response = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: new URLSearchParams({
                client_id: clientId,
                grant_type: 'refresh_token',
                refresh_token: refreshToken,
            }),
        });

        const data = await response.json();
        if (data.access_token) {
            localStorage.setItem('sp_access_token', data.access_token);
            if (data.refresh_token) localStorage.setItem('sp_refresh_token', data.refresh_token);
            return true;
        }
        return false;
    }

    function startPlayerPolling() {
        const layout = urlParams.get('layout') || 'compact';

        setInterval(async () => {
            let token = localStorage.getItem('sp_access_token');
            
            await fetchQueueList();

            let res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (res.status === 401) {
                let refreshed = await refreshAccessToken();
                if (refreshed) {
                    token = localStorage.getItem('sp_access_token');
                    res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                }
            }

            const wrapperEl = document.getElementById('widgetWrapper');

            if (res.status === 204 || res.status > 300) {
                wrapperEl.classList.remove('is-playing');
                return;
            }

            let data = await res.json();
            if (data && data.item) {
                wrapperEl.classList.remove('transparent-obs');
                wrapperEl.classList.add('is-playing');

                document.getElementById('trackTitle').innerText = data.item.name;
                document.getElementById('trackArtist').innerText = data.item.artists.map(a => a.name).join(', ');
                
                const imageUrl = data.item.album.images.length > 0 ? data.item.album.images[0].url : '';
                
                if (layout === 'vinyl') {
                    const vinylArt = document.getElementById('liveVinylArt');
                    if (vinylArt.src !== imageUrl) vinylArt.src = imageUrl;
                } else {
                    const artEl = document.getElementById('albumArt');
                    if (artEl.src !== imageUrl) artEl.src = imageUrl;
                }
                
                let progress = (data.progress_ms / data.item.duration_ms) * 100;
                document.getElementById('progressFill').style.width = `${progress}%`;
            }
        }, 3000);
    }

    async function fetchQueueList() {
        let token = localStorage.getItem('sp_access_token');
        let res = await fetch('https://api.spotify.com/v1/me/player/queue', {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401) {
            let refreshed = await refreshAccessToken();
            if (refreshed) {
                token = localStorage.getItem('sp_access_token');
                res = await fetch('https://api.spotify.com/v1/me/player/queue', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
            }
        }

        if (res.ok) {
            let data = await res.json();
            let queueListEl = document.getElementById('queueItemsList');
            if (!queueListEl) return;
            
            let upcoming = data.queue.slice(0, 3);
            
            const fallbackId = localStorage.getItem('fallback_playlist');
            if (upcoming.length === 0 && fallbackId) {
                await injectFallbackTrack(token, fallbackId);
                return;
            }

            queueListEl.innerHTML = '';
            if (upcoming.length === 0) {
                queueListEl.innerHTML = '<div style="color:var(--secondary-text); font-size:10px;">Queue is empty</div>';
                return;
            }

            upcoming.forEach(track => {
                let imgUrl = track.album.images.length > 0 ? track.album.images[track.album.images.length - 1].url : '';
                queueListEl.innerHTML += `
                    <div class="queue-item">
                        <img src="${imgUrl}" alt="Art">
                        <div class="queue-item-info">
                            <div style="font-weight:700; color:var(--text-color);">${track.name}</div>
                            <div style="color:var(--secondary-text);">${track.artists.map(a => a.name).join(', ')}</div>
                        </div>
                    </div>`;
            });
        }
    }

    async function injectFallbackTrack(token, playlistId) {
        try {
            let plRes = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/tracks`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!plRes.ok) return;
            let plData = await plRes.json();
            if (!plData.items || plData.items.length === 0) return;

            let validItems = plData.items.filter(item => item && item.track && item.track.uri && !item.is_local);
            if (validItems.length === 0) return;

            let randomTrack = validItems[Math.floor(Math.random() * validItems.length)].track;

            let qRes = await fetch(`https://api.spotify.com/v1/me/player/queue?uri=${encodeURIComponent(randomTrack.uri)}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            
            if (qRes.ok || qRes.status === 204) {
                showRequestStatus(`Fallback: Added ${randomTrack.name}`);
            }
        } catch (err) {
            console.error("Error processing fallback playlist injection:", err);
        }
    }

    function connectTwitchChat() {
        const channel = (localStorage.getItem('twitch_channel') || '').replace(/^#/, '').trim().toLowerCase();
        console.log("Connecting to Twitch chat for channel:", channel);
        const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

        ws.onopen = () => {
            ws.send('CAP REQ :twitch.tv/tags :twitch.tv/commands');
            ws.send('PASS SCHMOOPIIE');
            ws.send('NICK justinfan' + Math.floor(Math.random() * 80000));
            ws.send(`JOIN #${channel}`);
            console.log(`Joined channel #${channel}`);
        };

        ws.onmessage = async (event) => {
            const rawMessage = event.data;
            if (rawMessage.includes('PRIVMSG')) {
                const parts = rawMessage.split(' PRIVMSG ');
                if (parts.length < 2) return;

                const tagsPart = parts[0];
                const rest = parts[1];
                const channelAndMsg = rest.split(' :');
                if (channelAndMsg.length < 2) return;

                const userPart = tagsPart.includes('@') ? tagsPart.split('USER=')[0] : tagsPart;
                let user = "Viewer";
                if (userPart.includes('!')) {
                    user = userPart.substring(userPart.lastIndexOf(':') + 1, userPart.indexOf('!'));
                }

                const message = channelAndMsg.slice(1).join(' :').trim();
                const isModOrVip = tagsPart.includes('moderator/1') || tagsPart.includes('vip/1') || tagsPart.includes('broadcaster/1') || tagsPart.toLowerCase().includes('badges=broadcaster') || tagsPart.toLowerCase().includes('mod=1');

                if (message.startsWith('!sr ') || message.startsWith('!request ')) {
                    const query = message.substring(message.indexOf(' ') + 1).trim();
                    await searchAndQueueSong(query);
                } else if (message === '!skip' && urlParams.get('skip') !== 'no') {
                    const requireMod = urlParams.get('skipPerm') !== 'everyone';
                    if (!requireMod || isModOrVip) {
                        await skipCurrentTrack();
                    } else {
                        showRequestStatus(`@${user}: !skip requires Mod/VIP`);
                    }
                } else if (message === '!clear') {
                    if (isModOrVip) {
                        await clearQueue();
                    } else {
                        showRequestStatus(`@${user}: !clear requires Mod/VIP`);
                    }
                } else if (message === '!queue' || message === '!q') {
                    if (isModOrVip) {
                        toggleQueueVisibility();
                    } else {
                        showRequestStatus(`@${user}: !queue requires Mod/VIP`);
                    }
                }
            }
        };

        ws.onclose = () => {
            console.log("Twitch WS closed. Reconnecting in 5s...");
            setTimeout(connectTwitchChat, 5000);
        };
    }

    function toggleQueueVisibility() {
        const queueEl = document.getElementById('queueContainer');
        if (!queueEl) return;
        queueEl.classList.toggle('queue-hidden');
        const isHidden = queueEl.classList.contains('queue-hidden');
        showRequestStatus(isHidden ? "Queue panel hidden" : "Queue panel shown");
    }

    async function searchAndQueueSong(query) {
        let token = localStorage.getItem('sp_access_token');
        let searchRes = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=1`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });
        let searchData = await searchRes.json();
        
        if (searchData.tracks && searchData.tracks.items.length > 0) {
            let trackName = searchData.tracks.items[0].name;
            let queueRes = await fetch(`https://api.spotify.com/v1/me/player/queue?uri=${encodeURIComponent(searchData.tracks.items[0].uri)}`, {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });

            if (queueRes.ok || queueRes.status === 204) {
                showRequestStatus(`Added: ${trackName}`);
                await fetchQueueList();
            } else {
                showRequestStatus("Error: Open Spotify & play a song first!");
            }
        } else {
            showRequestStatus(`Track not found`);
        }
    }

    async function skipCurrentTrack() {
        let token = localStorage.getItem('sp_access_token');
        let res = await fetch('https://api.spotify.com/v1/me/player/next', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` }
        });
        if (res.ok || res.status === 204) {
            showRequestStatus("Skipped track via command");
        } else {
            showRequestStatus("Error: No active Spotify device!");
        }
    }

    async function clearQueue() {
        let token = localStorage.getItem('sp_access_token');
        let success = true;
        
        for (let i = 0; i < 15; i++) {
            let queueRes = await fetch('https://api.spotify.com/v1/me/player/queue', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!queueRes.ok) break;
            let queueData = await queueRes.json();
            if (!queueData.queue || queueData.queue.length === 0) break;

            let skipRes = await fetch('https://api.spotify.com/v1/me/player/next', {
                method: 'POST',
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!skipRes.ok && skipRes.status !== 204) {
                success = false;
                break;
            }
        }

        if (success) {
            showRequestStatus("Queue cleared via !clear");
            await fetchQueueList();
        } else {
            showRequestStatus("Failed to fully clear queue");
        }
    }

    function showRequestStatus(text) {
        const statusEl = document.getElementById('requestStatus');
        if (!statusEl) return;
        statusEl.innerText = text;
        setTimeout(() => {
            if (statusEl.innerText === text) statusEl.innerText = '';
        }, 6000);
    }

    function hexToRGBA(hex, alpha) {
        if (!hex.startsWith('#')) return hex;
        let r = parseInt(hex.slice(1, 3), 16),
            g = parseInt(hex.slice(3, 5), 16),
            b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function generateRandomString(length) {
        let text = '';
        let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
        return text;
    }

    async function sha256(plain) {
        const encoder = new TextEncoder();
        const data = encoder.encode(plain);
        return window.crypto.subtle.digest('SHA-256', data).then(buffer => {
            let base64URL = btoa(String.fromCharCode(...new Uint8Array(buffer)))
                .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
            return base64URL;
        });
    }
</script>

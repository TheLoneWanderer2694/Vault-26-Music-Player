<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music</title>
    <style>
        :root {
            --bg-color: rgba(18, 18, 18, 0.75);
            --text-color: #ffffff;
            --secondary-text: #b3b3b3;
            --accent-color: #1db954;
            --border-radius: 16px;
            --border-width: 1px;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-align: left;
            --widget-scale: 1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0e0e10;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        body.is-obs {
            background: transparent;
            justify-content: flex-start;
            align-items: flex-end; /* Anchored to top right */
            height: 100vh;
            overflow: hidden;
            padding: 0;
        }

        .setup-container {
            background: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 520px;
            width: 100%;
            text-align: left;
            max-height: 95vh;
            overflow-y: auto;
        }

        .setup-container h2 { margin-bottom: 4px; }
        .setup-container p { font-size: 12px; color: #b3b3b3; margin-bottom: 12px; }

        .form-group {
            margin-bottom: 10px;
        }

        .setup-container label {
            font-size: 10px;
            font-weight: 600;
            color: #b3b3b3;
            display: block;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .setup-container input[type="text"], 
        .setup-container input[type="number"],
        .setup-container input[type="range"], 
        .setup-container select {
            width: 100%;
            padding: 6px 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
        }

        .setup-container input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
            padding: 0;
        }

        .setup-container input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .setup-container input[type="color"]::-webkit-color-swatch {
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
        }

        .row { display: flex; gap: 8px; }
        .row .form-group { flex: 1; }

        .setup-container button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
            width: 100%;
            font-size: 13px;
        }

        .test-row { display: flex; gap: 6px; margin-top: 6px; }
        .test-row button { background: #3f3f46; font-size: 11px; padding: 6px; margin-top: 0; }
        .test-row button:hover { background: #52525b; }

        .obs-link-box {
            margin-top: 12px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            border: 1px dashed var(--accent-color);
        }

        .obs-link-box p { font-size: 11px; margin-bottom: 4px; color: #fff; }
        .obs-link-box input { font-size: 11px; padding: 5px; cursor: pointer; }

        .preview-label {
            font-size: 11px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- WIDGET WRAPPER & STYLES --- */
        .widget-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 350px;
            max-width: 100%;
            opacity: 1;
            visibility: visible;
            transform: scale(var(--widget-scale));
            transform-origin: top right; /* Scaled from top right anchor */
            transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out, transform 0.2s ease-out;
            overflow: hidden;
        }

        .widget-wrapper.transparent-obs {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        .widget-container {
            background: var(--bg-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            border: var(--border-width) solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: var(--text-align);
            overflow: hidden;
            position: relative;
            width: 100%;
        }

        /* Layout: Compact */
        .widget-container.compact {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px;
        }

        .widget-container.compact .album-art {
            width: 65px;
            height: 65px;
            border-radius: calc(var(--border-radius) - 4px);
            object-fit: cover;
            flex-shrink: 0;
            background: #333;
        }

        .widget-container.compact .track-info {
            flex-grow: 1;
            overflow: hidden;
        }

        /* Layout: Full Album Art Backdrop */
        .widget-container.full-art {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 180px;
            padding: 16px;
            background-size: cover;
            background-position: center;
            background-color: #222;
        }

        .widget-container.full-art::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 20%, rgba(0,0,0,0.2) 100%);
            z-index: 1;
        }

        .widget-container.full-art .track-info {
            position: relative;
            z-index: 2;
        }

        .widget-container.full-art .album-art { display: none; }

        /* Layout: Stacked Vertical */
        .widget-container.stacked {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            text-align: center !important;
        }

        .widget-container.stacked .album-art {
            width: 120px;
            height: 120px;
            border-radius: calc(var(--border-radius) - 4px);
            object-fit: cover;
            margin-bottom: 12px;
            background: #333;
        }

        .widget-container.stacked .track-info {
            width: 100%;
            overflow: hidden;
        }

        /* Layout: Minimalist Text Only */
        .widget-container.minimalist {
            display: flex;
            flex-direction: column;
            padding: 12px 18px;
        }

        .widget-container.minimalist .album-art { display: none; }
        .widget-container.minimalist .track-info { width: 100%; overflow: hidden; }

        /* Layout: HUD / Floating Pill */
        .widget-container.pill {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            border-radius: 50px;
            width: fit-content;
            max-width: 100%;
        }

        .widget-container.pill .album-art {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #333;
        }

        .widget-container.pill .track-info { overflow: hidden; }
        .widget-container.pill .progress-bar { display: none; }

        /* Layout: Vinyl Record Spinner */
        .widget-container.vinyl {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 18px;
            border-radius: 50px;
        }

        .widget-container.vinyl .vinyl-sleeve {
            position: relative;
            width: 60px;
            height: 60px;
            flex-shrink: 0;
        }

        .widget-container.vinyl .album-art {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            position: absolute;
            top: 2.5px;
            left: 2.5px;
            z-index: 2;
            animation: spinVinyl 6s linear infinite;
            animation-play-state: paused;
        }

        .widget-wrapper.is-playing .vinyl-container .album-art { animation-play-state: running; }

        .widget-container.vinyl .vinyl-record-grooves {
            width: 60px;
            height: 60px;
            background: repeating-radial-gradient(#111, #111 3px, #222 4px, #111 5px);
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .widget-container.vinyl .track-info { flex-grow: 1; overflow: hidden; }

        @keyframes spinVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Layout: Legend of Zelda Retro Theme 🛡️ */
        .widget-container.zelda {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px;
            background: linear-gradient(135deg, rgba(20, 45, 25, 0.95), rgba(10, 25, 15, 0.95)) !important;
            border: 3px solid #d4af37 !important;
            border-radius: 8px !important;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8), 0 8px 25px rgba(0,0,0,0.6) !important;
        }

        .widget-container.zelda .album-art {
            width: 60px;
            height: 60px;
            border: 2px solid #d4af37;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .widget-container.zelda .track-info { flex-grow: 1; overflow: hidden; }
        .widget-container.zelda .track-title { font-family: 'Georgia', serif; color: #f3e5ab; text-shadow: 1px 1px #000; }
        .widget-container.zelda .track-artist { font-family: 'Georgia', serif; color: #98fb98; }
        .widget-container.zelda .progress-fill { background: #d4af37; }
        .widget-container.zelda .request-status { color: #f0e68c; }

        /* Queue List Bottom Panel 🎶 (Shows up to 5 upcoming tracks) */
        .queue-container {
            position: absolute;
            top: calc(100% + 8px);
            left: 0;
            width: 100%;
            max-height: 150px;
            overflow-y: auto;
            background: var(--bg-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            border: var(--border-width) solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            padding: 12px 16px;
            z-index: 10;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out, transform 0.4s ease-in-out;
        }

        .queue-container.queue-hidden {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
            transform: translateY(-6px);
        }

        .queue-header {
            font-size: 10px;
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 6px;
            text-transform: uppercase;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 4px;
            letter-spacing: 0.5px;
        }

        .queue-items {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .queue-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            width: 100%;
        }

        .queue-item img {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .queue-item-info {
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            width: 100%;
        }

        /* Typography */
        .track-title-wrapper, .track-artist-wrapper {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .track-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-color);
            display: inline-block;
            margin-bottom: 2px;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 12px;
            color: var(--secondary-text);
            display: inline-block;
            margin-bottom: 6px;
            text-overflow: ellipsis;
        }

        .request-status {
            font-size: 10px;
            color: var(--accent-color);
            font-style: italic;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
            min-height: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 45%;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="setupScreen" class="setup-container hidden">

        <p>Advanced Customization & Live Simulation Studio</p>

                    <option value="full-art">Full Album Art Backdrop</option>

                    <option value="center">Center</option>
                    <option value="right">Right</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Queue Visibility</label>
                <select id="queueVisibilityInput" oninput="applyStylesAndLink()" onchange="applyStylesAndLink()">

                    <option value="enabled">Always Visible</option>
                    <option value="hidden">Always Hidden</option>
                </select>
            </div>
            <div class="form-group">
                <label>Widget Scale (<span id="scaleVal">100</span>%)</label>
                <input type="range" id="widgetScaleInput" min="50" max="200" step="5" value="100" oninput="applyStylesAndLink()">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Queue Visible Time (Sec)</label>
                <input type="number" id="queueShowTimeInput" min="2" max="120" value="10" oninput="applyStylesAndLink()">
            </div>
            <div class="form-group">
                <label>Queue Hidden Time (Sec)</label>
                <input type="number" id="queueHideTimeInput" min="2" max="300" value="15" oninput="applyStylesAndLink()">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Enable Skip Command (!skip)</label>
                <select id="enableSkipInput" oninput="applyStylesAndLink()">
                    <option value="yes">Allowed</option>
                    <option value="no">Disabled</option>
                </select>
            </div>
            <div class="form-group">
                <label>Skip Permission</label>
                <select id="skipPermissionInput" oninput="applyStylesAndLink()">
                    <option value="mod">Moderators & VIPs Only</option>
                    <option value="everyone">Everyone (Public)</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Border Radius</label>
                <input type="text" id="borderRadiusInput" value="16px" oninput="applyStylesAndLink()">
            </div>
            <div class="form-group">
                <label>Border Width</label>
                <input type="text" id="borderWidthInput" value="1px" oninput="applyStylesAndLink()">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Border Color</label>
                <input type="color" id="borderColorInput" value="#ffffff" oninput="applyStylesAndLink()">
            </div>
            <div class="form-group">
                <label>Background Color Picker</label>
                <input type="color" id="bgColorPicker" value="#121212" oninput="applyStylesAndLink()">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Background Opacity (<span id="opacityVal">75</span>%)</label>
                <input type="range" id="bgOpacityInput" min="0" max="100" value="75" oninput="applyStylesAnd

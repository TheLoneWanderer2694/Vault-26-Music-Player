<script src="https://cdn.jsdelivr.net/npm/tmi.js@1.8.5/185/tmi.min.js"></script>
<script>
  // Replace with your Twitch channel name and Spotify API Access Token
  const TWITCH_CHANNEL = 'YOUR_TWITCH_CHANNEL';
  const SPOTIFY_ACCESS_TOKEN = 'YOUR_SPOTIFY_ACCESS_TOKEN';

  // Initialize tmi.js client
  const client = new tmi.Client({
    channels: [TWITCH_CHANNEL]
  });

  client.connect();

  // Listen for Twitch Chat Commands
  client.on('message', (channel, tags, message, self) => {
    if (self) return;

    const command = message.trim().toLowerCase();

    switch (command) {
      case '!play':
        controlSpotifyPlayback('play');
        break;
      case '!pause':
        controlSpotifyPlayback('pause');
        break;
      case '!next':
      case '!skip':
        controlSpotifyPlayback('next');
        break;
      case '!previous':
      case '!prev':
      case '!back':
        controlSpotifyPlayback('previous');
        break;
      case '!clearqueue':
        clearSpotifyQueue();
        break;
    }
  });

  // Function to execute Playback API endpoints (Play, Pause, Next, Previous)
  async function controlSpotifyPlayback(action) {
    let endpoint = '';
    let method = 'POST';

    switch (action) {
      case 'play':
        endpoint = 'https://api.spotify.com/v1/me/player/play';
        method = 'PUT';
        break;
      case 'pause':
        endpoint = 'https://api.spotify.com/v1/me/player/pause';
        method = 'PUT';
        break;
      case 'next':
        endpoint = 'https://api.spotify.com/v1/me/player/next';
        method = 'POST';
        break;
      case 'previous':
        endpoint = 'https://api.spotify.com/v1/me/player/previous';
        method = 'POST';
        break;
    }

    try {
      const response = await fetch(endpoint, {
        method: method,
        headers: {
          'Authorization': `Bearer ${SPOTIFY_ACCESS_TOKEN}`,
          'Content-Type': 'application/json'
        }
      });

      if (response.ok) {
        console.log(`Successfully executed Spotify action: ${action}`);
      } else {
        console.error(`Spotify API error on ${action}:`, response.statusText);
      }
    } catch (error) {
      console.error(`Failed to send ${action} command:`, error);
    }
  }

  // Clear queue function using fast-skip loop and UI reset
  async function clearSpotifyQueue() {
    const queueList = document.getElementById('queue-list');
    if (queueList) queueList.innerHTML = '';

    const maxSkips = 10;
    for (let i = 0; i < maxSkips; i++) {
      await controlSpotifyPlayback('next');
    }
    console.log('Spotify queue cleared.');
  }
</script>

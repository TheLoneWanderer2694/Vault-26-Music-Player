<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spotify Widget - OBS</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --art-size: 56px;
    --art-radius: 8px;
    --title-size: 15px;
    --artist-size: 13px;
    --title-color: #ffffff;
    --artist-color: #b3b3b3;
    --progress-color: #1db954;
    --bg-color: transparent;
  }
  body {
    background: var(--bg-color);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100vw;
    height: 100vh;
    padding: 10px;
    overflow: hidden;
  }
  .art {
    width: var(--art-size);
    height: var(--art-size);
    border-radius: var(--art-radius);
    background: #282828 center/cover no-repeat;
    flex-shrink: 0;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    object-fit: cover;
  }
  .info { display: flex; flex-direction: column; justify-content: center; gap: 2px; min-width: 0; flex: 1; }
  .track {
    font-size: var(--title-size);
    font-weight: 600;
    color: var(--title-color);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .artist {
    font-size: var(--artist-size);
    font-weight: 400;
    color: var(--artist-color);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .art-container { position: relative; flex-shrink: 0; }
  .progress {
    position: absolute;
    bottom: 0; left: 0;
    height: 3px;
    background: var(--progress-color);
    width: 0%;
    border-radius: 0 0 var(--art-radius) var(--art-radius);
    transition: width 0.5s linear;
  }
  .now-playing-indicator {
    display: flex;
    align-items: flex-end;
    justify-content: center;
    gap: 2px;
    height: 14px;
    width: 16px;
    margin-left: 8px;
    flex-shrink: 0;
  }
  .now-playing-indicator span {
    width: 3px;
    background: var(--title-color);
    border-radius: 1px;
    animation: bar 0.8s ease-in-out infinite;
  }
  .now-playing-indicator span:nth-child(1) { height: 40%; animation-delay: -0.6s; }
  .now-playing-indicator span:nth-child(2) { height: 80%; animation-delay: -0.3s; }
  .now-playing-indicator span:nth-child(3) { height: 50%; animation-delay: -0.9s; }
  @keyframes bar {
    0%, 100% { transform: scaleY(0.4); }
    50% { transform: scaleY(1); }
  }
  .hidden { display: none !important; }
  .config-toggle {
    position: fixed;
    top: 10px;
    right: 10px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: rgba(255,255,255,0.1);
    border: none;
    color: #fff;
    font-size: 18px;
    cursor: pointer;
    z-index: 100;
  }
  .config-panel {
    position: fixed;
    top: 0; right: 0;
    width: 360px;
    height: 100vh;
    background: #181818;
    border-left: 1px solid #333;
    padding: 24px;
    overflow-y: auto;
    z-index: 99;
    color: #fff;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; color: #b3b3b3; margin-bottom: 6px; text-transform: uppercase; }
  .form-group input { width: 100%; padding: 8px; background: #121212; border: 1px solid #333; color: #fff; border-radius: 4px; }
  .form-group textarea { width: 100%; height: 50px; background: #121212; border: 1px solid #333; color: #fff; font-size: 11px; }
  .form-row { display: flex; gap: 8px; }
  .btn { padding: 8px 12px; background: #1db954; color: #000; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
  .btn.secondary { background: #333; color: #fff; }
</style>
</head>
<body>
  <div class="art-container" id="authTrigger" style="cursor: pointer;">
    <div class="art" id="art"></div>
    <div class="progress" id="progress"></div>
  </div>
  <div class="info">
    <div class="track" id="track">Loading widget...</div>
    <div class="artist" id="artist">Please wait</div>
  </div>

  <div class="config-panel hidden" id="configPanel">
    <h3>Widget Settings</h3>
    <div class="form-group">
      <label>Client ID</label>
      <input type="text" id="clientIdInput">
    </div>
    <div class="form-row">
      <div class="form-group"><label>Art Size</label><input type="number" id="artSizeInput" value="56"></div>
      <div class="form-group"><label>Radius</label><input type="number" id="artRadiusInput" value="8"></div>
    </div>
    <div class="form-group">
      <label>Custom OBS Link</label>
      <textarea id="generatedLinkOutput" readonly></textarea>
      <button class="btn secondary" id="copyLinkBtn" style="width:100%; margin-top:4px;">Copy Link</button>
    </div>
    <button class="btn" id="saveConfigBtn">Save & Reload</button>
    <button class="btn secondary" id="closeConfigBtn" style="margin-left:8px;">Close</button>
  </div>

  <button class="config-toggle" id="configToggle">⚙</button>

<script>
  const params = new URLSearchParams(window.location.search);
  const isOBS = params.get('obs') === 'true';
  const clientId = localStorage.getItem('sw_client_id') || 'YOUR_SPOTIFY_CLIENT_ID_HERE';
  const redirectUri = 'https://thelonewanderer2694.github.io/Vault-26-Music-Player/';
  
  if (isOBS) document.getElementById('configToggle').style.display = 'none';

  // Apply CSS variables safely on load
  const artSize = params.get('artSize') || localStorage.getItem('sw_artSize') || '56';
  const artRadius = params.get('artRadius') || localStorage.getItem('sw_artRadius') || '8';
  document.documentElement.style.setProperty('--art-size', artSize + 'px');
  document.documentElement.style.setProperty('--art-radius', artRadius + 'px');

  const trackEl = document.getElementById('track');
  const artistEl = document.getElementById('artist');
  const artEl = document.getElementById('art');

  document.getElementById('authTrigger').addEventListener('click', () => {
    if (clientId === 'YOUR_SPOTIFY_CLIENT_ID_HERE') {
      trackEl.textContent = 'Set Client ID in browser';
      return;
    }
    window.location.href = `https://accounts.spotify.com/authorize?client_id=${clientId}&response_type=code&redirect_uri=${encodeURIComponent(redirectUri)}&scope=user-read-currently-playing%20user-read-playback-state`;
  });

  async function run() {
    const code = params.get('code');
    if (code) {
      const verifier = localStorage.getItem('sw_code_verifier');
      try {
        const res = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ grant_type: 'authorization_code', code, redirect_uri: redirectUri, client_id: clientId, code_verifier: verifier })
        });
        const data = await res.json();
        if (data.access_token) {
          localStorage.setItem('sw_spotify_token', data.access_token);
          window.history.replaceState({}, document.title, window.location.pathname + (isOBS ? '?obs=true' : ''));
        }
      } catch (err) { console.error(err); }
    }

    const token = localStorage.getItem('sw_spotify_token');
    if (!token) {
      trackEl.textContent = 'Connect Spotify';
      artistEl.textContent = isOBS ? 'Interact & log in' : 'Click gear ⚙';
      return;
    }

    poll();
    setInterval(poll, 5000);
  }

  async function poll() {
    const token = localStorage.getItem('sw_spotify_token');
    if (!token) return;
    try {
      const res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
        headers: { 'Authorization': `Bearer ${token}` }
      });
      if (res.status === 204 || res.status === 304) {
        trackEl.textContent = 'Nothing playing';
        artistEl.textContent = 'Play music on Spotify';
        return;
      }
      const data = await res.json();
      if (data && data.item) {
        trackEl.textContent = data.item.name;
        artistEl.textContent = data.item.artists.map(a => a.name).join(', ');
        if (data.item.album?.images?[0]?.url) {
          artEl.style.backgroundImage = `url(${data.item.album.images[0].url})`;
        }
      }
    } catch (e) {
      trackEl.textContent = 'Connection error';
    }
  }

  run();

  // Settings UI logic
  const panel = document.getElementById('configPanel');
  document.getElementById('configToggle').addEventListener('click', () => {
    document.getElementById('clientIdInput').value = clientId === 'YOUR_SPOTIFY_CLIENT_ID_HERE' ? '' : clientId;
    const query = new URLSearchParams({ obs: 'true', artSize, artRadius }).toString();
    document.getElementById('generatedLinkOutput').value = window.location.origin + window.location.pathname + '?' + query;
    panel.classList.remove('hidden');
  });
  document.getElementById('closeConfigBtn').addEventListener('click', () => panel.classList.add('hidden'));
  document.getElementById('saveConfigBtn').addEventListener('click', () => {
    const val = document.getElementById('clientIdInput').value.trim();
    if (val) localStorage.setItem('sw_client_id', val);
    location.reload();
  });
  document.getElementById('copyLinkBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(document.getElementById('generatedLinkOutput').value);
  });
</script>
</body>
</html>

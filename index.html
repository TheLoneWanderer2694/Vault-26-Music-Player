<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Overlay Configurator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .config-card {
      background: #181818;
      border: 1px solid #282828;
      border-radius: 8px;
      padding: 24px;
      width: 100%;
      max-width: 600px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .section-divider {
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #1db954;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #282828;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      color: #b3b3b3;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .color-picker {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #282828;
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid #3e3e3e;
    }

    .color-picker input[type="color"] {
      -webkit-appearance: none;
      border: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      background: none;
    }

    .color-picker input[type="color"]::-webkit-color-swatch-wrapper {
      padding: 0;
    }

    .color-picker input[type="color"]::-webkit-color-swatch {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
    }

    .color-picker span {
      font-family: monospace;
      font-size: 13px;
      color: #fff;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .checkbox-group input[type="checkbox"] {
      accent-color: #1db954;
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    /* Preview Widget Styles */
    .preview-container {
      margin-top: 24px;
      padding-top: 16px;
      border-top: 1px solid #282828;
    }

    .widget-preview {
      padding: 16px;
      border-radius: 8px;
      transition: background-color 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .track-title {
      font-size: 18px;
      font-weight: 700;
    }

    .track-artist {
      font-size: 14px;
    }

    .up-next-container {
      margin-top: 8px;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div class="config-card">
    <!-- Colors & Visual Effects -->
    <div class="section-divider">Colors & Visual Effects</div>

    <div class="grid-3">
      <div>
        <label>Background</label>
        <div class="color-picker">
          <input type="color" id="cfgBg" value="#121212" oninput="updatePreview()" />
          <span id="cfgBgVal">#121212</span>
        </div>
        <label class="checkbox-group" style="margin-top: 6px;">
          <input type="checkbox" id="cfgTransparentBg" onchange="updatePreview()" />
          <span>Transparent BG</span>
        </label>
      </div>
      <div>
        <label>Title Color</label>
        <div class="color-picker">
          <input type="color" id="cfgText" value="#ffffff" oninput="updatePreview()" />
          <span id="cfgTextVal">#ffffff</span>
        </div>
      </div>
      <div>
        <label>Artist Color</label>
        <div class="color-picker">
          <input type="color" id="cfgArtistText" value="#b3b3b3" oninput="updatePreview()" />
          <span id="cfgArtistTextVal">#b3b3b3</span>
        </div>
      </div>
      <div>
        <label>Up Next Text</label>
        <div class="color-picker">
          <input type="color" id="cfgUpNextText" value="#1db954" oninput="updatePreview()" />
          <span id="cfgUpNextTextVal">#1db954</span>
        </div>
      </div>
    </div>

    <!-- Live Preview -->
    <div class="preview-container">
      <label>Live Preview</label>
      <div id="previewWidget" class="widget-preview">
        <div id="previewTitle" class="track-title">Song Title</div>
        <div id="previewArtist" class="track-artist">Artist Name</div>
        <div id="previewUpNext" class="up-next-container">Up Next: Upcoming Track</div>
      </div>
    </div>
  </div>

  <script>
    function updatePreview() {
      // Pickers & Inputs
      const bg = document.getElementById('cfgBg').value;
      const transparentBg = document.getElementById('cfgTransparentBg').checked;
      const text = document.getElementById('cfgText').value;
      const artistText = document.getElementById('cfgArtistText').value;
      const upNextText = document.getElementById('cfgUpNextText').value;

      // Update Labels
      document.getElementById('cfgBgVal').textContent = bg;
      document.getElementById('cfgTextVal').textContent = text;
      document.getElementById('cfgArtistTextVal').textContent = artistText;
      document.getElementById('cfgUpNextTextVal').textContent = upNextText;

      // Update Preview Elements
      const widget = document.getElementById('previewWidget');
      const titleEl = document.getElementById('previewTitle');
      const artistEl = document.getElementById('previewArtist');
      const upNextEl = document.getElementById('previewUpNext');

      widget.style.backgroundColor = transparentBg ? 'transparent' : bg;
      titleEl.style.color = text;
      artistEl.style.color = artistText;
      upNextEl.style.color = upNextText;
    }

    // Initial render call
    updatePreview();
  </script>
</body>
</html>

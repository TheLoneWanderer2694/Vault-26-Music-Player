<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced OBS Spotify & Twitch Widget</title>
    <style>
        :root {
            --bg-color: rgba(18, 18, 18, 0.75);
            --text-color: #ffffff;
            --secondary-text: #b3b3b3;
            --accent-color: #1db954;
            --border-radius: 16px;
            --border-width: 1px;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-align: left;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0e0e10;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        body.is-obs {
            background: transparent;
            justify-content: flex-end;
            align-items: flex-start;
            height: 100vh;
            overflow: hidden;
        }

        .setup-container {
            background: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 520px;
            width: 100%;
            text-align: left;
            max-height: 95vh;
            overflow-y: auto;
        }

        .setup-container h2 { margin-bottom: 4px; }
        .setup-container p { font-size: 12px; color: #b3b3b3; margin-bottom: 12px; }

        .form-group {
            margin-bottom: 10px;
        }

        .setup-container label {
            font-size: 10px;
            font-weight: 600;
            color: #b3b3b3;
            display: block;
            margin-bottom: 3px;
            text-transform: uppercase;
        }

        .setup-container input[type="text"], 
        .setup-container input[type="range"], 
        .setup-container select {
            width: 100%;
            padding: 6px 8px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #fff;
            font-size: 12px;
        }

        .setup-container input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 30px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
            padding: 0;
        }

        .setup-container input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .setup-container input[type="color"]::-webkit-color-swatch {
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
        }

        .row { display: flex; gap: 8px; }
        .row .form-group { flex: 1; }

        .setup-container button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 8px;
            width: 100%;
            font-size: 13px;
        }

        .test-row { display: flex; gap: 6px; margin-top: 6px; }
        .test-row button { background: #3f3f46; font-size: 11px; padding: 6px; margin-top: 0; }
        .test-row button:hover { background: #52525b; }

        .obs-link-box {
            margin-top: 12px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            border: 1px dashed var(--accent-color);
        }

        .obs-link-box p { font-size: 11px; margin-bottom: 4px; color: #fff; }
        .obs-link-box input { font-size: 11px; padding: 5px; cursor: pointer; }

        .preview-label {
            font-size: 11px;
            font-weight: bold;
            color: var(--accent-color);
            margin-top: 12px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* --- WIDGET STYLES (Shared) --- */
        .widget-container {
            background: var(--bg-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            border: var(--border-width) solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: var(--text-align);
            overflow: hidden;
            position: relative;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease-in-out, visibility 0.5s ease-in-out;
        }

        .widget-container.transparent-obs {
            opacity: 0 !important;
            visibility: hidden !important;
            pointer-events: none !important;
        }

        /* Layout: Compact */
        .widget-container.compact {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px;
            width: 100%;
        }

        .widget-container.compact .album-art {
            width: 65px;
            height: 65px;
            border-radius: calc(var(--border-radius) - 4px);
            object-fit: cover;
            flex-shrink: 0;
            background: #333;
        }

        .widget-container.compact .track-info {
            flex-grow: 1;
            overflow: hidden;
        }

        /* Layout: Full Album Art Backdrop */
        .widget-container.full-art {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            width: 100%;
            height: 180px;
            padding: 16px;
            background-size: cover;
            background-position: center;
            background-color: #222;
        }

        .widget-container.full-art::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 20%, rgba(0,0,0,0.2) 100%);
            z-index: 1;
        }

        .widget-container.full-art .track-info {
            position: relative;
            z-index: 2;
        }

        .widget-container.full-art .album-art { display: none; }

        /* Layout: Stacked Vertical */
        .widget-container.stacked {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 220px;
            padding: 16px;
            text-align: center !important;
        }

        .widget-container.stacked .album-art {
            width: 120px;
            height: 120px;
            border-radius: calc(var(--border-radius) - 4px);
            object-fit: cover;
            margin-bottom: 12px;
            background: #333;
        }

        .widget-container.stacked .track-info {
            width: 100%;
            overflow: hidden;
        }

        /* Layout: Minimalist Text Only */
        .widget-container.minimalist {
            display: flex;
            flex-direction: column;
            padding: 12px 18px;
            width: 100%;
        }

        .widget-container.minimalist .album-art { display: none; }

        .widget-container.minimalist .track-info {
            width: 100%;
            overflow: hidden;
        }

        /* Layout: HUD / Floating Pill */
        .widget-container.pill {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 14px;
            border-radius: 50px;
            width: fit-content;
            max-width: 350px;
        }

        .widget-container.pill .album-art {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
            background: #333;
        }

        .widget-container.pill .track-info {
            overflow: hidden;
        }

        .widget-container.pill .progress-bar { display: none; }

        /* --- NEW LAYOUT 1: Vinyl Record Spinner --- */
        .widget-container.vinyl {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 18px;
            width: 100%;
            border-radius: 50px;
        }

        .widget-container.vinyl .vinyl-sleeve {
            position: relative;
            width: 60px;
            height: 60px;
            flex-shrink: 0;
        }

        .widget-container.vinyl .album-art {
            width: 55px;
            height: 55px;
            border-radius: 50%;
            object-fit: cover;
            position: absolute;
            top: 2.5px;
            left: 2.5px;
            z-index: 2;
            animation: spinVinyl 6s linear infinite;
            animation-play-state: paused;
        }

        .widget-container.vinyl.is-playing .album-art {
            animation-play-state: running;
        }

        .widget-container.vinyl .vinyl-record-grooves {
            width: 60px;
            height: 60px;
            background: repeating-radial-gradient(#111, #111 3px, #222 4px, #111 5px);
            border-radius: 50%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .widget-container.vinyl .track-info {
            flex-grow: 1;
            overflow: hidden;
        }

        @keyframes spinVinyl {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* --- NEW LAYOUT 2: Glassmorphism Card --- */
        .widget-container.glass-card {
            display: flex;
            flex-direction: column;
            padding: 18px;
            width: 280px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .widget-container.glass-card .album-art {
            width: 100%;
            height: 140px;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 12px;
        }

        .widget-container.glass-card .track-info {
            width: 100%;
            overflow: hidden;
        }

        /* --- NEW LAYOUT 3: Bottom Ticker / Stream Banner --- */
        .widget-container.ticker {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 10px 24px;
            width: 100vw;
            max-width: 100%;
            border-radius: 0;
            border-left: none;
            border-right: none;
            border-bottom: none;
        }

        .widget-container.ticker .album-art {
            width: 42px;
            height: 42px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .widget-container.ticker .track-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-grow: 1;
            overflow: hidden;
        }

        .widget-container.ticker .track-title-wrapper { width: auto; }
        .widget-container.ticker .track-artist-wrapper { width: auto; margin-bottom: 0; }
        .widget-container.ticker .progress-bar { display: none; }
        .widget-container.ticker .request-status { margin-top: 0; margin-left: auto; }

        /* Typography */
        .track-title-wrapper, .track-artist-wrapper {
            width: 100%;
            overflow: hidden;
            white-space: nowrap;
        }

        .track-title {
            font-size: 15px;
            font-weight: 700;
            color: var(--text-color);
            display: inline-block;
            margin-bottom: 2px;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 12px;
            color: var(--secondary-text);
            display: inline-block;
            margin-bottom: 6px;
            text-overflow: ellipsis;
        }

        .request-status {
            font-size: 10px;
            color: var(--accent-color);
            font-style: italic;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 3px;
            min-height: 14px;
        }

        .progress-bar {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 45%;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Setup Screen (Configurator) -->
    <div id="setupScreen" class="setup-container hidden">
        <h2>Spotify Widget Studio</h2>
        <p>Advanced Customization & Live Simulation Studio</p>
        
        <div class="row">
            <div class="form-group">
                <label>Spotify Client ID</label>
                <input type="text" id="clientIdInput" placeholder="Client ID" oninput="applyStylesAndLink()">
            </div>
            <div class="form-group">
                <label>Twitch Channel</label>
                <input type="text" id="twitchChannelInput" placeholder="Channel name" oninput="applyStylesAndLink()">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Layout Mode</label>
                <select id="layoutModeInput" oninput="applyStylesAndLink()" onchange="applyStylesAndLink()">
                    <option value="compact">Compact (Side Art)</option>
                    <option value="full-art">Full Album Art Backdrop</option>
                    <option value="stacked">Stacked / Vertical</option>
                    <option value="minimalist">Minimalist (Text Only)</option>
                    <option value="pill">HUD / Floating Pill</option>
                    <option value="vinyl">Vinyl Record Spinner 💿</option>
                    <option value="glass-card">Glassmorphism Card 🧊</option>
                    <option value="ticker">Bottom Stream Ticker 📜</option>
                </select>
            </div>
            <div class="form-group">
                <label>Text Alignment</label>
                <select id="textAlignInput" oninput="applyStylesAndLink()" onchange="applyStylesAndLink()">
                    <option value="left">Left</option>
                    <option value="center">Center</option>
                    <option value="right">Right</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Border Radius</label>
                <input type="text" id="borderRadiusInput" value="16px" oninput="applyStylesAndLink()">
            </div>
            <div class="form-group">
                <label>Border Width</label>
                <input type="text" id="borderWidthInput" value="1px" oninput="applyStylesAndLink()">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Border Color</label>
                <input type="color" id="borderColorInput" value="#ffffff" oninput="applyStylesAndLink()">
            </div>
            <div class="form-group">
                <label>Background Color Picker</label>
                <input type="color" id="bgColorPicker" value="#121212" oninput="applyStylesAndLink()">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Background Opacity (<span id="opacityVal">75</span>%)</label>
                <input type="range" id="bgOpacityInput" min="0" max="100" value="75" oninput="applyStylesAndLink()">
            </div>
            <div class="form-group">
                <label>Text Color</label>
                <input type="color" id="textColorInput" value="#ffffff" oninput="applyStylesAndLink()">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Secondary Text Color</label>
                <input type="color" id="secondaryColorInput" value="#b3b3b3" oninput="applyStylesAndLink()">
            </div>
            <div class="form-group">
                <label>Show Progress Bar?</label>
                <select id="showProgressInput" oninput="applyStylesAndLink()" onchange="applyStylesAndLink()">
                    <option value="yes">Enabled</option>
                    <option value="no">Hidden</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group" style="flex: 1;">
                <label>Auto-Hide When Paused?</label>
                <select id="autoHideInput" oninput="applyStylesAndLink()" onchange="applyStylesAndLink()">
                    <option value="yes">Hide After 5s Inactive</option>
                    <option value="no">Always Visible</option>
                </select>
            </div>
        </div>

        <div class="preview-label">Live Preview & Test Controls</div>
        
        <!-- Configurator Live Preview Widget -->
        <div id="previewWidget" class="widget-container compact">
            <div id="previewVinylContainer" class="vinyl-sleeve hidden">
                <div class="vinyl-record-grooves"></div>
                <img id="previewVinylArt" class="album-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=150&auto=format&fit=crop&q=80" alt="Album Art">
            </div>
            <img id="previewAlbumArt" class="album-art" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=150&auto=format&fit=crop&q=80" alt="Album Art">
            <div class="track-info">
                <div class="track-title-wrapper"><div id="previewTitle" class="track-title">Sample Song Title</div></div>
                <div class="track-artist-wrapper"><div id="previewArtist" class="track-artist">Artist Name • Album Name</div></div>
                <div id="previewProgressBar" class="progress-bar">
                    <div class="progress-fill" style="width: 65%;"></div>
                </div>
                <div id="previewStatus" class="request-status">Requested by @Viewer123</div>
            </div>
        </div>

        <div class="test-row">
            <button type="button" onclick="testSimulatePlaying()">▶ Test Playing</button>
            <button type="button" onclick="testSimulatePaused()">⏸ Test Paused</button>
            <button type="button" onclick="testSimulateRequest()">💬 Test !sr Popups</button>
        </div>

        <button type="button" onclick="saveSettingsAndAuth()" style="margin-top: 10px;">Re-Authorize Spotify</button>

        <div id="linkBox" class="obs-link-box">
            <p><strong>Copy this OBS Browser Source Link:</strong></p>
            <input type="text" id="obsGeneratedLink" readonly onclick="this.select()">
        </div>
    </div>

    <!-- Live OBS Widget UI -->
    <div id="widgetScreen" class="widget-container hidden">
        <div id="liveVinylContainer" class="vinyl-sleeve hidden">
            <div class="vinyl-record-grooves"></div>
            <img id="liveVinylArt" class="album-art" src="" alt="Album Art">
        </div>
        <img id="albumArt" class="album-art" src="" alt="Album Art">
        <div class="track-info">
            <div class="track-title-wrapper"><div id="trackTitle" class="track-title">Not Playing</div></div>
            <div class="track-artist-wrapper"><div id="trackArtist" class="track-artist">Open Spotify to start</div></div>
            <div id="obsProgressBar" class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div id="requestStatus" class="request-status"></div>
        </div>
    </div>

    <script>
        const BASE_URL = window.location.href.split('?')[0].split('#')[0];
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const isObsMode = urlParams.get('obs') === 'true';

        let hideTimer = null;

        window.onload = async () => {
            if (isObsMode) {
                document.body.classList.add('is-obs');
                
                // Apply Styles in OBS mode from URL params
                const root = document.documentElement;
                root.style.setProperty('--border-radius', urlParams.get('radius') || '16px');
                root.style.setProperty('--border-width', urlParams.get('bwidth') || '1px');
                root.style.setProperty('--border-color', hexToRGBA(urlParams.get('bcolor') || '#ffffff', 0.2));
                root.style.setProperty('--bg-color', urlParams.get('bgcolor') || 'rgba(18, 18, 18, 0.75)');
                root.style.setProperty('--text-color', urlParams.get('tcolor') || '#ffffff');
                root.style.setProperty('--secondary-text', urlParams.get('stcolor') || '#b3b3b3');
                root.style.setProperty('--text-align', urlParams.get('align') || 'left');

                if (urlParams.get('prog') === 'no') {
                    document.getElementById('obsProgressBar').classList.add('hidden');
                }

                const layout = urlParams.get('layout') || 'compact';
                const widgetEl = document.getElementById('widgetScreen');
                widgetEl.classList.add(layout);
                widgetEl.classList.remove('hidden');

                if (layout === 'vinyl') {
                    document.getElementById('liveVinylContainer').classList.remove('hidden');
                    document.getElementById('albumArt').classList.add('hidden');
                }

                const token = urlParams.get('token');
                const refreshToken = urlParams.get('rtoken');
                const clientId = urlParams.get('cid');
                const channel = urlParams.get('ch');

                if (!token || !clientId || !channel) {
                    document.getElementById('trackTitle').innerText = "Config Error";
                    document.getElementById('trackArtist').innerText = "Please regenerate your link from the main page";
                    return;
                }

                localStorage.setItem('sp_access_token', token);
                localStorage.setItem('sp_refresh_token', refreshToken);
                localStorage.setItem('sp_client_id', clientId);
                localStorage.setItem('twitch_channel', channel);

                startPlayerPolling();
                connectTwitchChat();
                return;
            }

            if (code) {
                await exchangeCodeForToken(code);
                window.history.replaceState({}, document.title, BASE_URL);
            }

            // Load saved settings into inputs if available
            const savedClientId = localStorage.getItem('sp_client_id');
            const savedChannel = localStorage.getItem('twitch_channel');
            if (savedClientId) document.getElementById('clientIdInput').value = savedClientId;
            if (savedChannel) document.getElementById('twitchChannelInput').value = savedChannel;

            document.getElementById('setupScreen').classList.remove('hidden');
            applyStylesAndLink();
        };

        function applyStylesAndLink() {
            const radius = document.getElementById('borderRadiusInput').value || '16px';
            const bwidth = document.getElementById('borderWidthInput').value || '1px';
            const bcolor = document.getElementById('borderColorInput').value || '#ffffff';
            
            const bgColorHex = document.getElementById('bgColorPicker').value || '#121212';
            const bgOpacity = document.getElementById('bgOpacityInput').value;
            document.getElementById('opacityVal').innerText = bgOpacity;
            const bgcolor = hexToRGBA(bgColorHex, bgOpacity / 100);

            const tcolor = document.getElementById('textColorInput').value || '#ffffff';
            const stcolor = document.getElementById('secondaryColorInput').value || '#b3b3b3';
            const align = document.getElementById('textAlignInput').value || 'left';
            const layout = document.getElementById('layoutModeInput').value || 'compact';
            const prog = document.getElementById('showProgressInput').value || 'yes';
            const autohide = document.getElementById('autoHideInput').value || 'yes';

            // Save input state immediately
            const cid = document.getElementById('clientIdInput').value.trim();
            const channel = document.getElementById('twitchChannelInput').value.trim().toLowerCase();
            if (cid) localStorage.setItem('sp_client_id', cid);
            if (channel) localStorage.setItem('twitch_channel', channel);

            // Apply live to preview box
            const preview = document.getElementById('previewWidget');
            preview.style.setProperty('--border-radius', radius);
            preview.style.setProperty('--border-width', bwidth);
            preview.style.setProperty('--border-color', hexToRGBA(bcolor, 0.2));
            preview.style.setProperty('--bg-color', bgcolor);
            preview.style.setProperty('--text-color', tcolor);
            preview.style.setProperty('--secondary-text', stcolor);
            preview.style.setProperty('--text-align', align);

            preview.className = `widget-container ${layout}`;

            const vinylContainer = document.getElementById('previewVinylContainer');
            const standardArt = document.getElementById('previewAlbumArt');

            if (layout === 'vinyl') {
                vinylContainer.classList.remove('hidden');
                standardArt.classList.add('hidden');
                preview.classList.add('is-playing');
            } else {
                vinylContainer.classList.add('hidden');
                standardArt.classList.remove('hidden');
                preview.classList.remove('is-playing');
            }

            const progBar = document.getElementById('previewProgressBar');
            if (prog === 'no' || layout === 'ticker') {
                progBar.classList.add('hidden');
            } else {
                progBar.classList.remove('hidden');
            }

            if (layout === 'full-art') {
                preview.style.backgroundImage = `url('https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=300&auto=format&fit=crop&q=80')`;
            } else {
                preview.style.backgroundImage = 'none';
            }

            // Always generate OBS Link containing all custom parameters
            const token = localStorage.getItem('sp_access_token') || '';
            const rtoken = localStorage.getItem('sp_refresh_token') || '';

            const obsUrl = `${BASE_URL}?obs=true&layout=${layout}&align=${align}&prog=${prog}&autohide=${autohide}&radius=${encodeURIComponent(radius)}&bwidth=${encodeURIComponent(bwidth)}&bcolor=${encodeURIComponent(bcolor)}&bgcolor=${encodeURIComponent(bgcolor)}&tcolor=${encodeURIComponent(tcolor)}&stcolor=${encodeURIComponent(stcolor)}&token=${encodeURIComponent(token)}&rtoken=${encodeURIComponent(rtoken)}&cid=${encodeURIComponent(cid || localStorage.getItem('sp_client_id') || '')}&ch=${encodeURIComponent(channel || localStorage.getItem('twitch_channel') || '')}`;
            
            document.getElementById('obsGeneratedLink').value = obsUrl;
        }

        function testSimulatePlaying() {
            const preview = document.getElementById('previewWidget');
            preview.classList.remove('transparent-obs');
            preview.classList.add('is-playing');
            document.getElementById('previewTitle').innerText = "Blinding Lights";
            document.getElementById('previewArtist').innerText = "The Weeknd • After Hours";
            document.getElementById('previewStatus').innerText = "Playing Live in Studio";
        }

        function testSimulatePaused() {
            const preview = document.getElementById('previewWidget');
            preview.classList.remove('is-playing');
            document.getElementById('previewTitle').innerText = "Playback Paused / Inactive";
            document.getElementById('previewArtist').innerText = "Hiding in 5 seconds...";
            document.getElementById('previewStatus').innerText = "";
            
            setTimeout(() => {
                preview.classList.add('transparent-obs');
            }, 5000);
        }

        function testSimulateRequest() {
            const preview = document.getElementById('previewWidget');
            preview.classList.remove('transparent-obs');
            document.getElementById('previewStatus').innerText = "Requested by @StreamFan99";
            setTimeout(() => {
                document.getElementById('previewStatus').innerText = "Added: Bohemian Rhapsody";
            }, 3000);
        }

        async function saveSettingsAndAuth() {
            const cid = document.getElementById('clientIdInput').value.trim();
            const channel = document.getElementById('twitchChannelInput').value.trim().toLowerCase();
            if (!cid || !channel) return alert('Please fill in your Client ID and Twitch channel.');
            
            localStorage.setItem('sp_client_id', cid);
            localStorage.setItem('twitch_channel', channel);
            
            const verifier = generateRandomString(64);
            localStorage.setItem('sp_verifier', verifier);
            const challenge = await sha256(verifier);

            const scope = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';
            const authUrl = new URL('https://accounts.spotify.com/authorize');
            authUrl.searchParams.append('client_id', cid);
            authUrl.searchParams.append('response_type', 'code');
            authUrl.searchParams.append('redirect_uri', BASE_URL);
            authUrl.searchParams.append('code_challenge_method', 'S256');
            authUrl.searchParams.append('code_challenge', challenge);
            authUrl.searchParams.append('scope', scope);

            window.location.href = authUrl.toString();
        }

        async function exchangeCodeForToken(authCode) {
            const clientId = localStorage.getItem('sp_client_id');
            const verifier = localStorage.getItem('sp_verifier');

            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: 'authorization_code',
                    code: authCode,
                    redirect_uri: BASE_URL,
                    code_verifier: verifier,
                }),
            });

            const data = await response.json();
            if (data.access_token) {
                localStorage.setItem('sp_access_token', data.access_token);
                if (data.refresh_token) localStorage.setItem('sp_refresh_token', data.refresh_token);
            }
        }

        async function refreshAccessToken() {
            const clientId = localStorage.getItem('sp_client_id');
            const refreshToken = localStorage.getItem('sp_refresh_token');
            if (!refreshToken) return;

            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: 'refresh_token',
                    refresh_token: refreshToken,
                }),
            });

            const data = await response.json();
            if (data.access_token) {
                localStorage.setItem('sp_access_token', data.access_token);
                if (data.refresh_token) localStorage.setItem('sp_refresh_token', data.refresh_token);
            }
        }

        function startPlayerPolling() {
            const autoHideEnabled = urlParams.get('autohide') !== 'no';
            const layout = urlParams.get('layout') || 'compact';

            setInterval(async () => {
                let token = localStorage.getItem('sp_access_token');
                let res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401) {
                    await refreshAccessToken();
                    return;
                }

                const widgetEl = document.getElementById('widgetScreen');

                if (res.status === 204 || res.status > 300) {
                    widgetEl.classList.remove('is-playing');
                    if (autoHideEnabled && !hideTimer) {
                        hideTimer = setTimeout(() => {
                            widgetEl.classList.add('transparent-obs');
                        }, 5000);
                    }
                    return;
                }

                let data = await res.json();
                if (data && data.item) {
                    if (hideTimer) {
                        clearTimeout(hideTimer);
                        hideTimer = null;
                    }
                    widgetEl.classList.remove('transparent-obs');
                    widgetEl.classList.add('is-playing');

                    document.getElementById('trackTitle').innerText = data.item.name;
                    document.getElementById('trackArtist').innerText = data.item.artists.map(a => a.name).join(', ');
                    
                    const imageUrl = data.item.album.images.length > 0 ? data.item.album.images[0].url : '';
                    
                    if (layout === 'vinyl') {
                        const vinylArt = document.getElementById('liveVinylArt');
                        if (vinylArt.src !== imageUrl) vinylArt.src = imageUrl;
                    } else {
                        const artEl = document.getElementById('albumArt');
                        if (artEl.src !== imageUrl) artEl.src = imageUrl;
                    }

                    if (layout === 'full-art' && imageUrl) {
                        widgetEl.style.backgroundImage = `url('${imageUrl}')`;
                    }
                    
                    let progress = (data.progress_ms / data.item.duration_ms) * 100;
                    document.getElementById('progressFill').style.width = `${progress}%`;
                }
            }, 3000);
        }

        function connectTwitchChat() {
            const channel = localStorage.getItem('twitch_channel');
            const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

            ws.onopen = () => {
                ws.send('PASS SCHMOOPIIE');
                ws.send('NICK justinfan' + Math.floor(Math.random() * 80000));
                ws.send(`JOIN #${channel}`);
            };

            ws.onmessage = async (event) => {
                if (event.data.includes('PRIVMSG')) {
                    const match = event.data.match(/:(.+)!\S+ PRIVMSG #\S+ :(.+)/);
                    if (match) {
                        const user = match[1];
                        const message = match[2].trim();

                        let query = null;
                        if (message.startsWith('!sr ')) {
                            query = message.substring(4).trim();
                        } else if (message.startsWith('!request ')) {
                            query = message.substring(9).trim();
                        }

                        if (query) {
                            showRequestStatus(`Requested by @${user}`);
                            await searchAndQueueSong(query);
                        }
                    }
                }
            };

            ws.onclose = () => {
                setTimeout(connectTwitchChat, 5000);
            };
        }

        async function searchAndQueueSong(query) {
            let token = localStorage.getItem('sp_access_token');
            let searchRes = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=1`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            let searchData = await searchRes.json();
            
            if (searchData.tracks && searchData.tracks.items.length > 0) {
                let trackName = searchData.tracks.items[0].name;

                let queueRes = await fetch(`https://api.spotify.com/v1/me/player/queue?uri=${encodeURIComponent(searchData.tracks.items[0].uri)}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (queueRes.ok || queueRes.status === 204) {
                    showRequestStatus(`Added: ${trackName}`);
                }
            } else {
                showRequestStatus(`Track not found`);
            }
        }

        function showRequestStatus(text) {
            const statusEl = document.getElementById('requestStatus');
            if (!statusEl) return;
            statusEl.innerText = text;
            setTimeout(() => {
                if (statusEl.innerText === text) statusEl.innerText = '';
            }, 6000);
        }

        function hexToRGBA(hex, alpha) {
            if (!hex.startsWith('#')) return hex;
            let r = parseInt(hex.slice(1, 3), 16),
                g = parseInt(hex.slice(3, 5), 16),
                b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function generateRandomString(length) {
            let text = '';
            let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
            return text;
        }

        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data).then(buffer => {
                let base64URL = btoa(String.fromCharCode(...new Uint8Array(buffer)))
                    .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
                return base64URL;
            });
        }

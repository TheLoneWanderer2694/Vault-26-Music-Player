<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Queue Overlay</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      color: #ffffff;
      background: transparent;
      margin: 0;
      padding: 16px;
    }

    #queue-container {
      background: rgba(0, 0, 0, 0.75);
      border-radius: 8px;
      padding: 16px;
      max-width: 320px;
    }

    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      border-bottom: 2px solid #ffffff;
      padding-bottom: 8px;
    }

    #queue-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
    }

    #queue-list li {
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
    }

    #queue-list li:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>

  <div id="queue-container">
    <h2>Music Queue</h2>
    <ul id="queue-list"></ul>
  </div>

  <!-- Socket.io client library -->
  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let musicQueue = [];

    // Listen for clear_queue event from the server/bot
    socket.on('clear_queue', () => {
      musicQueue = [];
      renderQueue();
    });

    // Listen for queue update events from the server/bot
    socket.on('update_queue', (updatedQueue) => {
      musicQueue = updatedQueue;
      renderQueue();
    });

    // Render queue items in DOM
    function renderQueue() {
      const listElement = document.getElementById('queue-list');
      listElement.innerHTML = '';

      musicQueue.forEach((track, index) => {
        const li = document.createElement('li');
        li.textContent = `${index + 1}. ${track.title || track}`;
        listElement.appendChild(li);
      });
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced OBS Spotify & Twitch Widget</title>
    <style>
        :root {
            --bg-color: rgba(18, 18, 18, 0.75);
            --text-color: #ffffff;
            --secondary-text: #b3b3b3;
            --accent-color: #1db954;
            --border-radius: 16px;
            --border-width: 1px;
            --border-color: rgba(255, 255, 255, 0.1);
            --text-align: left;
            --layout-mode: compact; /* compact or full-art */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background: #0e0e10;
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        body.is-obs {
            background: transparent;
            justify-content: flex-end;
            align-items: flex-start;
            height: 100vh;
            overflow: hidden;
        }

        .setup-container {
            background: rgba(24, 24, 27, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 500px;
            width: 100%;
            text-align: left;
            max-height: 90vh;
            overflow-y: auto;
        }

        .setup-container h2 { margin-bottom: 6px; }
        .setup-container p { font-size: 13px; color: #b3b3b3; margin-bottom: 16px; }

        .form-group {
            margin-bottom: 12px;
        }

        .setup-container label {
            font-size: 11px;
            font-weight: 600;
            color: #b3b3b3;
            display: block;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .setup-container input, .setup-container select {
            width: 100%;
            padding: 8px 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
        }

        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }

        .setup-container button {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 12px;
            width: 100%;
        }

        .obs-link-box {
            margin-top: 16px;
            padding: 12px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 8px;
            border: 1px dashed var(--accent-color);
        }

        .obs-link-box p { font-size: 11px; margin-bottom: 6px; color: #fff; }
        .obs-link-box input { font-size: 11px; padding: 6px; }

        /* --- WIDGET STYLES (Controlled via URL variables) --- */
        .widget-container {
            background: var(--bg-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--border-radius);
            border: var(--border-width) solid var(--border-color);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            text-align: var(--text-align);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeIn 0.5s forwards;
            overflow: hidden;
            position: relative;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Layout: Compact */
        .widget-container.compact {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            max-width: 420px;
            width: 100%;
        }

        .widget-container.compact .album-art {
            width: 75px;
            height: 75px;
            border-radius: calc(var(--border-radius) - 4px);
            object-fit: cover;
            flex-shrink: 0;
        }

        .widget-container.compact .track-info {
            flex-grow: 1;
            overflow: hidden;
        }

        /* Layout: Full Album Art Backdrop */
        .widget-container.full-art {
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            width: 320px;
            height: 320px;
            padding: 20px;
            background-size: cover;
            background-position: center;
        }

        .widget-container.full-art::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.85) 20%, rgba(0,0,0,0.2) 100%);
            z-index: 1;
        }

        .widget-container.full-art .track-info {
            position: relative;
            z-index: 2;
        }

        .widget-container.full-art .album-art { display: none; }

        .track-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .track-artist {
            font-size: 13px;
            color: var(--secondary-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 8px;
        }

        .request-status {
            font-size: 11px;
            color: var(--accent-color);
            font-style: italic;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 4px;
            min-height: 15px;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent-color);
            width: 0%;
            transition: width 0.5s linear;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- Setup Screen (Configurator) -->
    <div id="setupScreen" class="setup-container hidden">
        <h2>Spotify Widget Studio</h2>
        <p>Configure your styling parameters and generate your custom OBS overlay link.</p>
        
        <div class="row">
            <div class="form-group">
                <label>Spotify Client ID</label>
                <input type="text" id="clientIdInput" placeholder="Client ID">
            </div>
            <div class="form-group">
                <label>Twitch Channel</label>
                <input type="text" id="twitchChannelInput" placeholder="Channel name">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Layout Mode</label>
                <select id="layoutModeInput">
                    <option value="compact">Compact (Side Art)</option>
                    <option value="full-art">Full Album Art Backdrop</option>
                </select>
            </div>
            <div class="form-group">
                <label>Text Alignment</label>
                <select id="textAlignInput">
                    <option value="left">Left</option>
                    <option value="center">Center</option>
                    <option value="right">Right</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Border Radius</label>
                <input type="text" id="borderRadiusInput" value="16px">
            </div>
            <div class="form-group">
                <label>Border Width</label>
                <input type="text" id="borderWidthInput" value="1px">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Border Color</label>
                <input type="color" id="borderColorInput" value="#ffffff">
            </div>
            <div class="form-group">
                <label>Background Color</label>
                <input type="text" id="bgColorInput" value="rgba(18, 18, 18, 0.75)">
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label>Text Color</label>
                <input type="color" id="textColorInput" value="#ffffff">
            </div>
            <div class="form-group">
                <label>Secondary Text Color</label>
                <input type="color" id="secondaryColorInput" value="#b3b3b3">
            </div>
        </div>

        <button onclick="saveSettingsAndAuth()">Authorize & Generate OBS Link</button>

        <div id="linkBox" class="obs-link-box hidden">
            <p><strong>Copy this custom link into your OBS Browser Source:</strong></p>
            <input type="text" id="obsGeneratedLink" readonly onclick="this.select()">
        </div>
    </div>

    <!-- Live OBS Widget UI -->
    <div id="widgetScreen" class="widget-container hidden">
        <img id="albumArt" class="album-art" src="" alt="Album Art">
        <div class="track-info">
            <div id="trackTitle" class="track-title">Not Playing</div>
            <div id="trackArtist" class="track-artist">Open Spotify to start</div>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <div id="requestStatus" class="request-status"></div>
        </div>
    </div>

    <script>
        const BASE_URL = window.location.href.split('?')[0].split('#')[0];
        const urlParams = new URLSearchParams(window.location.search);
        const code = urlParams.get('code');
        const isObsMode = urlParams.get('obs') === 'true';

        window.onload = async () => {
            if (isObsMode) {
                document.body.classList.add('is-obs');
                
                // Apply Custom Styles from URL Parameters
                const root = document.documentElement;
                root.style.setProperty('--border-radius', urlParams.get('radius') || '16px');
                root.style.setProperty('--border-width', urlParams.get('bwidth') || '1px');
                root.style.setProperty('--border-color', hexToRGBA(urlParams.get('bcolor') || '#ffffff', 0.2));
                root.style.setProperty('--bg-color', urlParams.get('bgcolor') || 'rgba(18, 18, 18, 0.75)');
                root.style.setProperty('--text-color', urlParams.get('tcolor') || '#ffffff');
                root.style.setProperty('--secondary-text', urlParams.get('stcolor') || '#b3b3b3');
                root.style.setProperty('--text-align', urlParams.get('align') || 'left');

                const layout = urlParams.get('layout') || 'compact';
                const widgetEl = document.getElementById('widgetScreen');
                widgetEl.classList.add(layout);
                widgetEl.classList.remove('hidden');

                const token = localStorage.getItem('sp_access_token');
                if (!token) {
                    document.getElementById('trackTitle').innerText = "Auth Required";
                    document.getElementById('trackArtist').innerText = "Open configuration page first";
                    return;
                }

                startPlayerPolling();
                connectTwitchChat();
                return;
            }

            if (code) {
                await exchangeCodeForToken(code);
                window.history.replaceState({}, document.title, BASE_URL);
                showObsLinkGenerator();
            } else {
                const savedClientId = localStorage.getItem('sp_client_id');
                const savedChannel = localStorage.getItem('twitch_channel');
                if (savedClientId && localStorage.getItem('sp_access_token')) {
                    document.getElementById('clientIdInput').value = savedClientId;
                    document.getElementById('twitchChannelInput').value = savedChannel || '';
                    showObsLinkGenerator();
                }
                document.getElementById('setupScreen').classList.remove('hidden');
            }
        };

        function saveSettingsAndAuth() {
            const cid = document.getElementById('clientIdInput').value.trim();
            const channel = document.getElementById('twitchChannelInput').value.trim().toLowerCase();
            if (!cid || !channel) return alert('Please fill in your Client ID and Twitch channel.');
            
            localStorage.setItem('sp_client_id', cid);
            localStorage.setItem('twitch_channel', channel);
            redirectToAuth();
        }

        async function redirectToAuth() {
            const clientId = localStorage.getItem('sp_client_id');
            const verifier = generateRandomString(64);
            localStorage.setItem('sp_verifier', verifier);
            const challenge = await sha256(verifier);

            const scope = 'user-read-playback-state user-modify-playback-state user-read-currently-playing';
            const authUrl = new URL('https://accounts.spotify.com/authorize');
            authUrl.searchParams.append('client_id', clientId);
            authUrl.searchParams.append('response_type', 'code');
            authUrl.searchParams.append('redirect_uri', BASE_URL);
            authUrl.searchParams.append('code_challenge_method', 'S256');
            authUrl.searchParams.append('code_challenge', challenge);
            authUrl.searchParams.append('scope', scope);

            window.location.href = authUrl.toString();
        }

        async function exchangeCodeForToken(authCode) {
            const clientId = localStorage.getItem('sp_client_id');
            const verifier = localStorage.getItem('sp_verifier');

            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: 'authorization_code',
                    code: authCode,
                    redirect_uri: BASE_URL,
                    code_verifier: verifier,
                }),
            });

            const data = await response.json();
            if (data.access_token) {
                localStorage.setItem('sp_access_token', data.access_token);
                if (data.refresh_token) localStorage.setItem('sp_refresh_token', data.refresh_token);
            }
        }

        function showObsLinkGenerator() {
            document.getElementById('setupScreen').classList.remove('hidden');
            
            // Gather styling parameters
            const layout = document.getElementById('layoutModeInput').value;
            const align = document.getElementById('textAlignInput').value;
            const radius = document.getElementById('borderRadiusInput').value;
            const bwidth = document.getElementById('borderWidthInput').value;
            const bcolor = document.getElementById('borderColorInput').value;
            const bgcolor = document.getElementById('bgColorInput').value;
            const tcolor = document.getElementById('textColorInput').value;
            const stcolor = document.getElementById('secondaryColorInput').value;

            const obsUrl = `${BASE_URL}?obs=true&layout=${layout}&align=${align}&radius=${encodeURIComponent(radius)}&bwidth=${encodeURIComponent(bwidth)}&bcolor=${encodeURIComponent(bcolor)}&bgcolor=${encodeURIComponent(bgcolor)}&tcolor=${encodeURIComponent(tcolor)}&stcolor=${encodeURIComponent(stcolor)}`;
            
            document.getElementById('obsGeneratedLink').value = obsUrl;
            document.getElementById('linkBox').classList.remove('hidden');
        }

        async function refreshAccessToken() {
            const clientId = localStorage.getItem('sp_client_id');
            const refreshToken = localStorage.getItem('sp_refresh_token');
            if (!refreshToken) return;

            const response = await fetch('https://accounts.spotify.com/api/token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: new URLSearchParams({
                    client_id: clientId,
                    grant_type: 'refresh_token',
                    refresh_token: refreshToken,
                }),
            });

            const data = await response.json();
            if (data.access_token) {
                localStorage.setItem('sp_access_token', data.access_token);
                if (data.refresh_token) localStorage.setItem('sp_refresh_token', data.refresh_token);
            }
        }

        function startPlayerPolling() {
            setInterval(async () => {
                let token = localStorage.getItem('sp_access_token');
                let res = await fetch('https://api.spotify.com/v1/me/player/currently-playing', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (res.status === 401) {
                    await refreshAccessToken();
                    return;
                }

                if (res.status === 204 || res.status > 300) return;

                let data = await res.json();
                if (data && data.item) {
                    document.getElementById('trackTitle').innerText = data.item.name;
                    document.getElementById('trackArtist').innerText = data.item.artists.map(a => a.name).join(', ');
                    
                    const imageUrl = data.item.album.images.length > 0 ? data.item.album.images[0].url : '';
                    const artEl = document.getElementById('albumArt');
                    if (artEl.src !== imageUrl) artEl.src = imageUrl;

                    const layout = urlParams.get('layout') || 'compact';
                    if (layout === 'full-art' && imageUrl) {
                        document.getElementById('widgetScreen').style.backgroundImage = `url('${imageUrl}')`;
                    }
                    
                    let progress = (data.progress_ms / data.item.duration_ms) * 100;
                    document.getElementById('progressFill').style.width = `${progress}%`;
                }
            }, 3000);
        }

        function connectTwitchChat() {
            const channel = localStorage.getItem('twitch_channel');
            const ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');

            ws.onopen = () => {
                ws.send('PASS SCHMOOPIIE');
                ws.send('NICK justinfan' + Math.floor(Math.random() * 80000));
                ws.send(`JOIN #${channel}`);
            };

            ws.onmessage = async (event) => {
                if (event.data.includes('PRIVMSG')) {
                    const match = event.data.match(/:(.+)!\S+ PRIVMSG #\S+ :(.+)/);
                    if (match) {
                        const user = match[1];
                        const message = match[2].trim();

                        let query = null;
                        if (message.startsWith('!sr ')) {
                            query = message.substring(4).trim();
                        } else if (message.startsWith('!request ')) {
                            query = message.substring(9).trim();
                        }

                        if (query) {
                            showRequestStatus(`Requested by @${user}`);
                            await searchAndQueueSong(query);
                        }
                    }
                }
            };

            ws.onclose = () => {
                setTimeout(connectTwitchChat, 5000);
            };
        }

        async function searchAndQueueSong(query) {
            let token = localStorage.getItem('sp_access_token');
            let searchRes = await fetch(`https://api.spotify.com/v1/search?q=${encodeURIComponent(query)}&type=track&limit=1`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            let searchData = await searchRes.json();
            
            if (searchData.tracks && searchData.tracks.items.length > 0) {
                let trackUri = searchData.tracks.items[0].url || searchData.tracks.items[0].uri;
                let trackName = searchData.tracks.items[0].name;

                let queueRes = await fetch(`https://api.spotify.com/v1/me/player/queue?uri=${encodeURIComponent(searchData.tracks.items[0].uri)}`, {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (queueRes.ok || queueRes.status === 204) {
                    showRequestStatus(`Added: ${trackName}`);
                }
            } else {
                showRequestStatus(`Track not found`);
            }
        }

        function showRequestStatus(text) {
            const statusEl = document.getElementById('requestStatus');
            if (!statusEl) return;
            statusEl.innerText = text;
            setTimeout(() => {
                if (statusEl.innerText === text) statusEl.innerText = '';
            }, 6000);
        }

        function hexToRGBA(hex, alpha) {
            if (!hex.startsWith('#')) return hex;
            let r = parseInt(hex.slice(1, 3), 16),
                g = parseInt(hex.slice(3, 5), 16),
                b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function generateRandomString(length) {
            let text = '';
            let possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            for (let i = 0; i < length; i++) text += possible.charAt(Math.floor(Math.random() * possible.length));
            return text;
        }

        async function sha256(plain) {
            const encoder = new TextEncoder();
            const data = encoder.encode(plain);
            return window.crypto.subtle.digest('SHA-256', data).then(buffer => {
                let base64URL = btoa(String.fromCharCode(...new Uint8Array(buffer)))
                    .replace(/=/g, '').replace(/\+/g, '-').replace(/\//g, '_');
                return base64URL;
            });
        }
    </script>
</body>
</html>
